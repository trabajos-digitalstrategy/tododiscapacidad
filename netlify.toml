[build]
  publish = "public"
  command = "npm ci --include=optional && npm run build"

[build.environment]
  NODE_VERSION = "18"
  NETLIFY_USE_LEGACY_BUILD_IMAGE = "false"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
